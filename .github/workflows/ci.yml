# PropelIQ CI — runs on every pull request targeting main and on pushes to main.
# Jobs: validate-secrets → ci-frontend ∥ ci-backend (parallel, both need validate-secrets).
# AC-1: build + lint + unit tests complete and report status within 10 minutes.
# AC-4: any step failure stops the job; error surfaces in $GITHUB_STEP_SUMMARY.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel any in-progress run for the same ref when a new commit is pushed.
# Prevents queueing of redundant builds on rapid consecutive commits.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege permissions: read code, write check results and PR comments.
permissions:
  contents: read
  checks: write
  pull-requests: write

# ──────────────────────────────────────────────────────────────────────────────
jobs:
  # ── 1. Secrets validation ─────────────────────────────────────────────────
  # Fails fast with a descriptive message if deployment credentials are absent.
  # All downstream jobs depend on this job so the pipeline never proceeds with
  # incomplete credentials (Edge Case: missing secrets → no deployment).
  validate-secrets:
    name: Validate Required Secrets
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check required secrets
        run: |
          missing=""
          if [ -z "$DEPLOY_TOKEN" ]; then missing="$missing DEPLOY_TOKEN"; fi
          if [ -z "$REGISTRY_URL" ]; then missing="$missing REGISTRY_URL"; fi
          if [ -n "$missing" ]; then
            echo "::error::Missing required secrets:$missing"
            echo "## ❌ Secrets Validation Failed" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "The following repository secrets are not configured: \`$missing\`" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Configure them at **Settings → Secrets and variables → Actions**." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "✅ All required secrets are present." >> "$GITHUB_STEP_SUMMARY"
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
          REGISTRY_URL: ${{ secrets.REGISTRY_URL }}

  # ── 2. Frontend CI ────────────────────────────────────────────────────────
  # Angular 17: install → lint → production build → unit tests with coverage.
  ci-frontend:
    name: Frontend — Build, Lint, Test
    runs-on: ubuntu-latest
    needs: validate-secrets
    timeout-minutes: 10
    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Lint
        run: npm run lint
        # ng lint exits non-zero on violations; step failure stops the job (AC-4).

      - name: Build (production)
        run: npm run build:prod
        # Verifies AOT compilation and that the bundle stays within budget thresholds.

      - name: Unit tests
        uses: nick-fields/retry@v3
        with:
          max_attempts: 3
          timeout_minutes: 5
          command: |
            cd app && npx ng test \
              --no-watch \
              --code-coverage \
              --browsers=ChromeHeadless \
              --karma-config=karma.conf.js

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: app/coverage/
          retention-days: 7

      - name: Write frontend summary
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "## ✅ Frontend CI Passed" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## ❌ Frontend CI Failed" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Step | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|------|--------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Lint | see step log |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Build (prod) | see step log |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Unit tests | see step log |" >> "$GITHUB_STEP_SUMMARY"

  # ── 3. Backend CI ─────────────────────────────────────────────────────────
  # ASP.NET Core 8: build → format check → unit tests → integration tests.
  # A PostgreSQL service container (pgvector/pg15) provides the DB for integration tests.
  ci-backend:
    name: Backend — Build, Lint, Test
    runs-on: ubuntu-latest
    needs: validate-secrets
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server

    # Service container is accessible at localhost:5432 inside the job.
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_DB: propeliq_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d propeliq_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('server/**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore PropelIQ.sln

      - name: Build
        run: dotnet build PropelIQ.sln --configuration Release --no-restore
        # Non-zero exit stops the job immediately (AC-4 fail-fast).

      - name: Format check (lint)
        run: dotnet format PropelIQ.sln --verify-no-changes
        # Exits 1 when any file would be reformatted; enforces consistent code style.

      - name: Unit tests
        uses: nick-fields/retry@v3
        with:
          max_attempts: 3
          timeout_minutes: 5
          command: |
            cd server && dotnet test PropelIQ.sln \
              --configuration Release \
              --no-build \
              --logger "trx;LogFileName=test-results.trx" \
              --results-directory ./TestResults \
              --blame-hang-timeout 60s

        env:
          # Connection string for unit tests that need a real DB.
          # Service container is available at localhost because ports are mapped.
          ConnectionStrings__Default: "Host=localhost;Port=5432;Database=propeliq_test;Username=test_user;Password=test_pass;Search Path=app"
          ConnectionStrings__Redis: ""

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: server/TestResults/
          retention-days: 7

      - name: Publish test results to PR
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Backend Test Results
          path: server/TestResults/*.trx
          reporter: dotnet-trx
          fail-on-error: true

      - name: Write backend summary
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "## ✅ Backend CI Passed" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## ❌ Backend CI Failed" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Step | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|------|--------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Build | see step log |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Format check | see step log |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Unit tests | see step log |" >> "$GITHUB_STEP_SUMMARY"
