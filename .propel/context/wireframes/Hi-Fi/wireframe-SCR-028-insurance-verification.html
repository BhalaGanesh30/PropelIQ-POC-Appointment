<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SCR-028 Insurance Verification</title>
  <link rel="stylesheet" href="./wireframe-theme.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand"><strong>Insurance</strong><small>Patient and staff use</small></div>
      <div class="nav-group"><div class="nav-item active">Insurance Verification</div><div class="nav-item">Documents</div></div>
    </aside>
    <main class="content">
      <header class="topbar"><div><div class="eyebrow">SCR-028</div><h2>Verify insurance details and card images</h2></div><div class="chip-row"><span class="pill">Soft validation</span><span class="pill success">Primary and secondary support</span></div></header>
      <section class="panel"><div class="card span-7"><h3>Coverage details</h3><div class="stack"><label class="field"><strong>Provider</strong><div class="input">Acme Health Plan</div></label><label class="field"><strong>Policy number</strong><div class="input">ACM-455-9981</div></label><label class="field"><strong>Group</strong><div class="input">NorthCare-Gold</div></label></div></div><div class="card span-5"><h3>Card images</h3><div class="stack"><div class="dropzone"><p>Upload front and back card images</p></div><div class="chip-row"><span class="badge warning">Soft warning: member DOB mismatch</span></div><button class="button primary">Run verification</button></div></div></section>
    </main>
  </div>
  <script defer src="./wireframe-interactions.js"></script>
</body>
</html>
