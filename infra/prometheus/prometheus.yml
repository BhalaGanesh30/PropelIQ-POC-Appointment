# Prometheus scrape configuration for PropelIQ development stack.
#
# Two scrape targets:
#   propeliq-api    — ASP.NET Core API's built-in /metrics Prometheus endpoint
#                     (exposed by OpenTelemetry.Exporter.Prometheus.AspNetCore).
#   otel-collector  — Prometheus metrics emitted by the OTel Collector itself
#                     (pipeline throughput, queue depth, etc.).

global:
  scrape_interval: 15s      # How often to scrape each target.
  evaluation_interval: 15s  # How often to evaluate alerting rules (none defined here).

scrape_configs:
  - job_name: "propeliq-api"
    metrics_path: /metrics
    static_configs:
      - targets: ["api:5000"]
        labels:
          service: "propeliq-api"

  - job_name: "otel-collector"
    static_configs:
      - targets: ["otel-collector:8889"]
        labels:
          service: "otel-collector"
