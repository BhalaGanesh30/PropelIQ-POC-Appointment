server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Angular HTML5 pushState routing:
    # All routes that do not match a real file fall back to index.html so the
    # Angular router can handle client-side navigation correctly.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache hashed static assets (Angular appends content hashes to filenames).
    # Aggressive browser caching is safe because filenames change on rebuild.
    location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Security headers (OWASP A05 — security misconfiguration).
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Disable nginx version disclosure.
    server_tokens off;

    # Gzip compression for text assets (NFR-001: reduce payload size).
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml text/javascript;
    gzip_min_length 1024;
    gzip_vary on;
}
